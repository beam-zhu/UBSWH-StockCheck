<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Cin7 连接设置 · Urbansales</title><style>/* INLINE_CSS */</style></head><body><header><a class="brand" href="/">▥ <span>URBANSALES<small>WAREHOUSE MANAGEMENT</small></span></a><div class="head-actions"><span class="private" data-zh="仅所有者可配置" data-en="Owner settings"></span><button id="language">English</button><a href="/" data-zh="返回报告管理 →" data-en="Back to reports →"></a></div></header><main style="max-width:850px"><div class="heading"><div><div class="eyebrow">CIN7 CORE</div><h1 data-zh="Cin7 连接设置" data-en="Cin7 connection settings"></h1><p data-zh="在这里填写 API Key，无需发送到聊天中。" data-en="Enter your API key here instead of sending it in chat."></p></div></div><section class="card settings-card"><p id="connection-state" role="status"></p><form id="cin7-form" autocomplete="off"><label for="account-id"><span>Account ID · api-auth-accountid</span><input id="account-id" name="accountId" type="text" autocomplete="off" maxlength="36" required spellcheck="false"></label><label for="application-key"><span>Application Key · api-auth-applicationkey</span><input id="application-key" name="applicationKey" type="password" autocomplete="new-password" maxlength="2048" required spellcheck="false" autocapitalize="off"></label><p class="settings-note" data-zh="Key 会加密保存在服务器端，保存后不回显，也不下发到扫描器。已有 Key 无法在页面中查看；需要更换时重新填写并保存。" data-en="Your key is encrypted on the server and is not returned to this page or sent to scanners. Enter and save a new key to replace it."></p><button id="save-settings" class="primary" type="submit" disabled data-zh="保存连接信息" data-en="Save connection settings"></button><p id="save-message" role="status" hidden></p></form><div class="settings-explanation"><strong data-zh="保存后会发生什么？" data-en="What happens after saving?"></strong><p data-zh="保存不会自动调用 Cin7。配置后可在扫描页面点击差异 SKU 的「Cin7 实时校对」，仅查询该 SKU 的库存；Google 报表仍作为盘点基准。" data-en="Saving does not call Cin7. On the scanner, click Cin7 live check on a differing SKU to query its stock. Google reports remain the check baseline."></p></div></section></main><script type="module">/* INLINE_JS */</script></body></html>
