<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#28664c"><title>盘点报告管理 · Urbansales</title><style>/* INLINE_CSS */</style></head><body><header><a class="brand" href="/">▥ <span>URBANSALES<small>WAREHOUSE MANAGEMENT</small></span></a><div class="head-actions"><a href="/cin7" data-zh="Cin7 连接设置" data-en="Cin7 settings"></a><span class="private" data-zh="管理者专用" data-en="Private console"></span><button id="language">English</button><a class="scanner-link" href="https://warehouse-bin-check.urbansales-6102.chatgpt.site/" target="_blank" rel="noopener" data-zh="打开扫描端 ↗" data-en="Open scanner ↗"></a></div></header><main><div class="heading"><div><div class="eyebrow">CLOUD REPORTS</div><h1 data-zh="盘点报告管理" data-en="Stock check reports"></h1><p data-zh="汇总各台扫描器的核对报告，让差异有迹可查。" data-en="One place for reports from every scanner, with differences ready to review."></p></div><button class="primary" id="refresh" data-zh="↻ 刷新报告" data-en="↻ Refresh reports"></button></div><div class="stats" id="stats"></div><section class="card"><form id="filters"><label><span data-zh="库位" data-en="Location"></span><input id="location" placeholder="A01-01" maxlength="80"></label><label class="wide"><span data-zh="操作者 / 扫描器" data-en="Operator / scanner"></span><input id="query" maxlength="100"></label><label><span data-zh="结果" data-en="Result"></span><select id="status"><option value="all" data-zh="所有报告" data-en="All reports"></option><option value="differences" data-zh="存在差异" data-en="Has differences"></option><option value="matched" data-zh="全部一致" data-en="All matched"></option></select></label><label><span data-zh="接收日期（从）" data-en="Received from"></span><input id="from" type="date"></label><label><span data-zh="接收日期（至）" data-en="Received until"></span><input id="to" type="date"></label><button type="submit" class="primary" data-zh="筛选" data-en="Apply"></button><button type="button" id="reset" data-zh="重置" data-en="Reset"></button></form><div class="list-heading"><h2 data-zh="上传记录" data-en="Uploaded reports"></h2><span id="sync"></span></div><p id="error" class="error" role="alert" hidden></p><div class="table-wrap"><table><thead><tr><th data-zh="库位 / 轮次" data-en="Location / round"></th><th data-zh="操作者 / 扫描器" data-en="Operator / scanner"></th><th data-zh="核对完成 / 云端接收" data-en="Completed / received"></th><th data-zh="SKU 差异" data-en="SKU differences"></th><th data-zh="实点 / 基准总量" data-en="Counted / expected"></th><th data-zh="操作" data-en="Actions"></th></tr></thead><tbody id="reports"></tbody></table></div><div id="empty" class="empty" hidden><div>▤</div><h3 data-zh="暂无报告" data-en="No reports yet"></h3><p data-zh="扫描器完成核对并上传后，报告将在这里显示。已有本机报告可在扫描端点击「上传报告」。" data-en="Reports appear here after a scanner finishes and uploads a check. Use Upload report on the scanner to submit an existing completed check."></p></div><nav class="pagination" aria-label="报告分页"><span id="page-info" aria-live="polite"></span><div class="pagination-controls"><label class="page-size-label"><span data-zh="每页" data-en="Per page"></span><select id="page-size" aria-label="每页报告数"><option value="25">25</option><option value="50">50</option><option value="100">100</option></select></label><button id="first" type="button" data-zh="第一页" data-en="First"></button><button id="prev" type="button" data-zh="上一页" data-en="Previous"></button><label class="page-number-label"><span data-zh="页码" data-en="Page"></span><select id="page-select" aria-label="选择页码"></select></label><button id="next" type="button" data-zh="下一页" data-en="Next"></button><button id="last" type="button" data-zh="最后一页" data-en="Last"></button></div></nav></section><p class="footnote" data-zh="每次上传独立留档，补扫报告保留历史。报告为提交时的库存快照，不会回写库存表。页面每 60 秒自动刷新。" data-en="Each completed round is kept as a separate report. Reports capture the submitted inventory snapshot and do not update stock. This page refreshes every 60 seconds."></p></main><div id="detail-modal" class="backdrop" hidden><section class="detail card" role="dialog" aria-modal="true" aria-labelledby="detail-heading"><div class="detail-top"><div><div class="eyebrow">REPORT DETAIL</div><h2 id="detail-heading"></h2></div><button id="close-detail" data-zh="关闭 ×" data-en="Close ×"></button></div><div id="detail-meta" class="detail-meta"></div><div class="detail-actions"><label><input id="differences-only" type="checkbox"><span data-zh="只看差异" data-en="Differences only"></span></label><button id="detail-export" class="primary" data-zh="↓ 导出 CSV" data-en="↓ Export CSV"></button></div><div class="table-wrap"><table><thead><tr><th>SKU</th><th data-zh="基准" data-en="Expected"></th><th data-zh="实点" data-en="Counted"></th><th data-zh="差异" data-en="Difference"></th><th data-zh="结果" data-en="Result"></th><th data-zh="备注 · 其他库位" data-en="Note · Other locations"></th></tr></thead><tbody id="detail-rows"></tbody></table></div></section></div><script type="module">/* INLINE_JS */</script></body></html>
