<section id="google-login" style="position:fixed;inset:0;z-index:100;background:#f3f5f1;display:grid;place-items:center"><form id="google-login-form" style="background:white;border:1px solid #dce3d8;border-radius:12px;padding:30px;max-width:420px;display:block"><h2>Google 测试管理端 / Test console</h2><p>输入新项目的管理口令 / Enter the new project’s admin password</p><input id="google-password" aria-label="管理口令 / Admin password" type="password" autocomplete="current-password" required style="margin:16px 0"><button type="submit">登录 / Sign in</button><p id="google-login-error" role="alert"></p></form></section>
<script>document.getElementById('google-login-form').onsubmit=async e=>{e.preventDefault();const p=document.getElementById('google-password'),button=e.currentTarget.querySelector('button');button.disabled=true;try{await StockGoogle.login(p.value);p.value='';location.reload();}catch(err){document.getElementById('google-login-error').textContent=err.message;}finally{button.disabled=false;}};if(sessionStorage.getItem(StockGoogle.sessionKey))document.getElementById('google-login').hidden=true;</script>
