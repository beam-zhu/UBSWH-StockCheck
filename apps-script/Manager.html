</style></head><body><header><a class="brand" href="__MANAGER_URL__">▥ <span>URBANSALES<small>WAREHOUSE MANAGEMENT</small></span></a><div class="head-actions"><a href="__SETTINGS_URL__" data-zh="Cin7 连接设置" data-en="Cin7 settings"></a><span class="private" data-zh="管理者专用" data-en="Private console"></span><button id="language">English</button><a class="scanner-link" href="__SCANNER_URL__" target="_blank" rel="noopener" data-zh="打开扫描端 ↗" data-en="Open scanner ↗"></a></div></header><main><div class="heading"><div><div class="eyebrow">CLOUD REPORTS</div><h1 data-zh="盘点报告管理" data-en="Stock check reports"></h1><p data-zh="汇总各台扫描器的核对报告，让差异有迹可查。" data-en="One place for reports from every scanner, with differences ready to review."></p></div><button class="primary" id="refresh" data-zh="↻ 刷新报告" data-en="↻ Refresh reports"></button></div><div class="stats" id="stats"></div><section class="card"><form id="filters"><label><span data-zh="库位" data-en="Location"></span><input id="location" placeholder="A01-01" maxlength="80"></label><label class="wide"><span data-zh="操作者 / 扫描器" data-en="Operator / scanner"></span><input id="query" maxlength="100"></label><label><span data-zh="结果" data-en="Result"></span><select id="status"><option value="all" data-zh="所有报告" data-en="All reports"></option><option value="differences" data-zh="存在差异" data-en="Has differences"></option><option value="matched" data-zh="全部一致" data-en="All matched"></option></select></label><label><span data-zh="接收日期（从）" data-en="Received from"></span><input id="from" type="date"></label><label><span data-zh="接收日期（至）" data-en="Received until"></span><input id="to" type="date"></label><button type="submit" class="primary" data-zh="筛选" data-en="Apply"></button><button type="button" id="reset" data-zh="重置" data-en="Reset"></button></form><div class="list-heading"><h2 data-zh="上传记录" data-en="Uploaded reports"></h2><span id="sync"></span></div><p id="error" class="error" role="alert" hidden></p><div class="table-wrap"><table><thead><tr><th data-zh="库位 / 轮次" data-en="Location / round"></th><th data-zh="操作者 / 扫描器" data-en="Operator / scanner"></th><th data-zh="核对完成 / 云端接收" data-en="Completed / received"></th><th data-zh="SKU 差异" data-en="SKU differences"></th><th data-zh="实点 / 基准总量" data-en="Counted / expected"></th><th data-zh="操作" data-en="Actions"></th></tr></thead><tbody id="reports"></tbody></table></div><div id="empty" class="empty" hidden><div>▤</div><h3 data-zh="暂无报告" data-en="No reports yet"></h3><p data-zh="扫描器完成核对并上传后，报告将在这里显示。已有本机报告可在扫描端点击「上传报告」。" data-en="Reports appear here after a scanner finishes and uploads a check. Use Upload report on the scanner to submit an existing completed check."></p></div><nav class="pagination" aria-label="报告分页"><span id="page-info" aria-live="polite"></span><div class="pagination-controls"><label class="page-size-label"><span data-zh="每页" data-en="Per page"></span><select id="page-size" aria-label="每页报告数"><option value="25">25</option><option value="50">50</option><option value="100">100</option></select></label><button id="first" type="button" data-zh="第一页" data-en="First"></button><button id="prev" type="button" data-zh="上一页" data-en="Previous"></button><label class="page-number-label"><span data-zh="页码" data-en="Page"></span><select id="page-select" aria-label="选择页码"></select></label><button id="next" type="button" data-zh="下一页" data-en="Next"></button><button id="last" type="button" data-zh="最后一页" data-en="Last"></button></div></nav></section><p class="footnote" data-zh="每次上传独立留档，补扫报告保留历史。报告为提交时的库存快照，不会回写库存表。页面每 60 秒自动刷新。" data-en="Each completed round is kept as a separate report. Reports capture the submitted inventory snapshot and do not update stock. This page refreshes every 60 seconds."></p></main><div id="detail-modal" class="backdrop" hidden><section class="detail card" role="dialog" aria-modal="true" aria-labelledby="detail-heading"><div class="detail-top"><div><div class="eyebrow">REPORT DETAIL</div><h2 id="detail-heading"></h2></div><button id="close-detail" data-zh="关闭 ×" data-en="Close ×"></button></div><div id="detail-meta" class="detail-meta"></div><div class="detail-actions"><label><input id="differences-only" type="checkbox"><span data-zh="只看差异" data-en="Differences only"></span></label><button id="detail-export" class="primary" data-zh="↓ 导出 CSV" data-en="↓ Export CSV"></button></div><div class="table-wrap"><table><thead><tr><th>SKU</th><th data-zh="基准" data-en="Expected"></th><th data-zh="实点" data-en="Counted"></th><th data-zh="差异" data-en="Difference"></th><th data-zh="结果" data-en="Result"></th><th data-zh="备注 · 其他库位" data-en="Note · Other locations"></th></tr></thead><tbody id="detail-rows"></tbody></table></div></section></div><script>window.STOCKCHECK_CONFIG={apiUrl:"",environment:"google-test"};</script><script>// Browser -> Apps Script. POST text/plain avoids JSON preflight; no no-cors and no JSONP.
(function(){
 const nativeFetch=window.fetch.bind(window);let scannerToken='',scannerConfigPromise=null;
 const sessionKey='ubswh.google.admin.session';
 function adminToken(){try{return sessionStorage.getItem(sessionKey)||'';}catch{return '';}}
 function endpoint(){const url=window.STOCKCHECK_CONFIG?.apiUrl||'';if(!/^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(url))throw Error('尚未配置新 Google 测试后台 / New Google test backend is not configured');return url;}
 async function call(action,args={},signal){if(window.google?.script?.run){if(signal?.aborted)throw new DOMException('Aborted','AbortError');return new Promise((resolve,reject)=>{const abort=()=>reject(new DOMException('Aborted','AbortError'));signal?.addEventListener('abort',abort,{once:true});window.google.script.run.withSuccessHandler(value=>{signal?.removeEventListener('abort',abort);resolve(value);}).withFailureHandler(()=>{signal?.removeEventListener('abort',abort);reject(Error('Google 服务调用失败 / Google service call failed'));}).stockCheckRpc({action,...args});});}const res=await nativeFetch(endpoint(),{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,...args}),credentials:'omit',redirect:'follow',signal,cache:'no-store'});if(!res.ok)throw Error('Google backend HTTP '+res.status);let value;try{value=await res.json();}catch{throw Error('Google 后台没有返回 JSON；请检查部署权限 / Backend did not return JSON; check deployment access');}if(!value||typeof value.status!=='number'||!('data'in value))throw Error('Invalid Google backend response');return value;}
 async function scannerConfig(signal){if(!scannerConfigPromise)scannerConfigPromise=call('scanner_config',{},signal).then(r=>{if(!r.ok)throw Error(r.data.error);scannerToken=r.data.scannerToken;return r.data;}).catch(e=>{scannerConfigPromise=null;throw e;});return scannerConfigPromise;}
 window.StockGoogle={call,sessionKey,hasAdminSession(){const t=adminToken().split('.');return t.length===4&&t[0]==='admin'&&Number(t[1])*1000>Date.now();},async login(password){const r=await call('admin_login',{password});if(!r.ok)throw Error('管理口令不正确、请求过多或后台未初始化 / Invalid password, rate limit, or backend not initialized');sessionStorage.setItem(sessionKey,r.data.token);},logout(){sessionStorage.removeItem(sessionKey);location.reload();}};
 window.fetch=async function(input,options={}){const path=typeof input==='string'?input:'';if(!path.startsWith('/api/'))return nativeFetch(input,options);const url=new URL(path,location.href),body=options.body?JSON.parse(options.body):{},signal=options.signal;let result;
 if(url.pathname==='/api/inventory')result=await call('inventory',{refresh:url.searchParams.get('refresh')==='1'},signal);
 else if(['/api/upload-config','/api/cin7/config'].includes(url.pathname)){const data=await scannerConfig(signal);return new Response(JSON.stringify(data),{status:200});}
 else if(url.pathname==='/api/upload-report'){await scannerConfig(signal);result=await call('upload_report',{...body,scannerToken},signal);if(result.data?.error==='SESSION'){scannerConfigPromise=null;await scannerConfig(signal);result=await call('upload_report',{...body,scannerToken},signal);}}
 else if(url.pathname==='/api/cin7/lookup'){await scannerConfig(signal);result=await call('cin7_lookup',{...body,scannerToken},signal);if(result.data?.error==='SESSION'){scannerConfigPromise=null;await scannerConfig(signal);result=await call('cin7_lookup',{...body,scannerToken},signal);}}
 else if(url.pathname==='/api/reports')result=await call('list_reports',{token:adminToken(),query:Object.fromEntries(url.searchParams)},signal);
 else if(url.pathname==='/api/cin7/settings')result=await call('cin7_settings',{token:adminToken(),...body,save:options.method==='POST'},signal);
 else {const m=url.pathname.match(/^\/api\/reports\/(r_[a-f0-9]{64})(\/csv)?$/);if(!m)throw Error('Unsupported endpoint');result=await call(m[2]?'report_csv':'report_detail',{token:adminToken(),id:m[1],lang:url.searchParams.get('lang')||'zh'},signal);if(m[2]&&result.ok)return new Response(result.data.csv,{status:200,headers:{'Content-Type':'text/csv;charset=utf-8'}});}
 if(result.status===401){sessionStorage.removeItem(sessionKey);document.getElementById('google-login')?.removeAttribute('hidden');}
 return new Response(JSON.stringify(result.data),{status:result.status,headers:{'Content-Type':'application/json'}});
 };
})();

function toEnglish(value) {
    const leading = value.match(/^\s*/)?.[0] ?? '', trailing = value.match(/\s*$/)?.[0] ?? '', s = value.trim();
    let out = EN[s];
    if (out === undefined) {
        const rules = [
            [/^本机已核对 (\d+) 个库位$/, (n) => `${n} locations checked on this device`],
            [/^库存已同步 · (.*)$/, (time) => `Inventory synced · ${time}`],
            [/^录入数量 (.*)$/, (sku) => `Enter quantity ${sku}`],
            [/^库位库存数据异常：(.*)$/, (details) => `Location inventory data issue: ${details.replace(/第 (\d+) 行商品没有有效的 ~数字 后缀（(.*?)）/g, 'Row $1: missing ~numeric SKU suffix ($2)').replace(/SKU (\d+) 的 G 列数量无效或为负数（(.*?)）/g, 'SKU $1: invalid or negative column G quantity ($2)')}`],
            [/^初始 Google 基准读取：(.*)$/, (time) => `Original Google baseline fetched: ${time}`],
            [/^库位 (.+) · Google 原始基准 (.*) · 当前基准 (.*) · 实点 (.*)$/, (loc, google, current, actual) => `Location ${loc} · Original Google ${google} · Current expected ${current} · Counted ${actual}`],
            [/^基准来源 Cin7 · 原 Google ([\d.]+) → 采用 ([\d.]+) · 读取 (.*)$/, (google, quantity, time) => `Cin7 baseline · Original Google ${google} → Adopted ${quantity} · Fetched ${time}`],
            [/^已采用 SKU (\d+) 的 Cin7 基准：([\d.]+)；原 Google 数量和查询时间已保留。$/, (sku, quantity) => `Adopted Cin7 baseline for SKU ${sku}: ${quantity}. Original Google quantity and query time are retained.`],
            [/^库位 (.+) · Google 基准 (.*) · 实点 (.*)$/, (loc, expected, actual) => `Location ${loc} · Google expected ${expected} · Counted ${actual}`],
            [/^Cin7 当前库位可用数量：(.*)$/, (quantity) => `Cin7 available at this location: ${quantity}`],
            [/^Cin7 读取：(.*) · 本次 API 请求 (\d+)(.*)$/, (time, calls, cached) => `Cin7 fetched: ${time} · API requests: ${calls}${cached ? ' (reused result from the last 5 seconds)' : ''}`],
            [/^手动录入 (.+) · 已确认实物为 0 · 当前累计 ([\d.]+)$/, (sku, total) => `Manual entry ${sku} · Confirmed zero physical stock · Total ${total}`],
            [/^手动录入 (.+) · 增加 ([\d.]+) · 当前累计 ([\d.]+)(.*)$/, (sku, amount, total, tail) => `Manual entry ${sku} · Added ${amount} · Total ${total}${EN[tail] ?? tail}`],
            [/^本机有 (\d+) 份报告待上传，网络恢复后将自动重试。$/, (n) => `${n} reports are waiting on this device. Upload will retry when connected.`],
            [/^报告已上传 · (.*)$/, (time) => `Report uploaded · ${time}`],
            [/^第 (\d+) 轮 · 扫描中$/, (n) => `Round ${n} · Scanning`],
            [/^已保存 (\d+) · \+1 件 · 当前累计 ([\d.]+) 件(.*)$/, (sku, n, tail) => `Saved ${sku} · +1 item · Total ${n}${EN[tail] ?? tail}`],
            [/^已保存 (.+) × ([\d.]+)，请扫描下一款。$/, (sku, n) => `Saved ${sku} × ${n}. Scan the next item.`],
            [/^有 (\d+) 项需要复核，请查看差异。$/, (n) => `${n} differences need review. See the list below.`],
            [/^差异 ([-\d.]+)$/, (n) => `Difference ${n}`],
            [/^收到条码：(.*) · (.*)$/, (code, time) => `Barcode: ${code} · ${time.replace('上午', 'AM ').replace('下午', 'PM ')}`],
            [/^正在接收条码：(.*)$/, (code) => `Receiving barcode: ${code}`],
            [/^刚才读到：(.*)$/, (code) => `Barcode read: ${code}`],
            [/^当前核对基准：(.*)$/, (time) => `Check baseline: ${time}`],
            [/^参考读取：(.*?)(（与本轮核对基准版本不同）)?$/, (time, different) => `Reference fetched: ${time}${different ? ' (different from this check’s baseline version)' : ''}`],
            [/^其他库位（G 列可用数量）：(.*)$/, (locations) => 'Other locations (G · Available): ' + locations.replaceAll('（源数据异常，仅供参考）', ' (source data issue; reference only)').replaceAll('：', ': ').replaceAll('；', '; ')],
            [/^(\d+) 个$/, (n) => `${n} locations`],
            [/^修改数量 (.+)$/, (sku) => `Edit quantity ${sku}`],
            [/^删除误扫 (.+)$/, (sku) => `Delete mistaken scan ${sku}`],
            [/^删除 SKU (.+) 的扫描记录？删除后可重新扫描。$/, (sku) => `Delete the scan record for SKU ${sku}? You can scan it again afterwards.`],
            [/^已删除 (.+)，可以重新扫描。$/, (sku) => `Deleted ${sku}. You can scan it again.`],
            [/^URBANSALES · 逐件计数版 (v\d+)$/, (v) => `URBANSALES · Item counter ${v}`],
            [/^找不到 (.+) 的正数量库存，请检查库位$/, (loc) => `No positive inventory found at ${loc}. Check the location.`],
            [/^(.+) 源数据异常：(.+)$/, (loc, reason) => `Inventory data issue at ${loc}: ${toEnglish(reason)}`],
            [/^第 (\d+) 行商品没有有效的 ~数字 后缀$/, (row) => `Row ${row}: SKU has no valid ~digits suffix`],
            [/^SKU (\d+) 的 G 列数量无效或为负数（(.+)）$/, (sku, n) => `SKU ${sku}: invalid or negative quantity in column G (${n})`],
            [/^数字 SKU (\d+) 对应多个完整 SKU，需核实源数据$/, (sku) => `Numeric SKU ${sku} maps to multiple full SKUs. Check the source data.`],
            [/^第 (\d+) 行字段不足$/, (row) => `Row ${row} has missing fields`],
            [/^无法恢复或保存任务：(.*)。请保留浏览器原数据，暂勿开始新任务。$/, (reason) => `Could not restore or save the check: ${toEnglish(reason)}. Keep the original browser data and do not start a new check yet.`],
            [/^(.*)。已开始任务可按原基准继续，新任务需等待库存恢复。$/, (reason) => `${toEnglish(reason)}. Existing checks can continue with their original baseline. Wait for inventory to recover before starting a new check.`]
        ];
        for (const [pattern, replace] of rules) {
            const match = s.match(pattern);
            if (match) {
                out = replace(...match.slice(1));
                break;
            }
        }
    }
    return out === undefined ? value : leading + out + trailing;
}
function translateReport(csv, lang) {
    if (lang !== 'en')
        return csv;
    // Parse CSV locally so only labels/status/notes are translated; identifiers and quantities stay unchanged.
    const rows = [];
    let row = [], field = '', quoted = false;
    const text = csv.replace(/^\uFEFF/, '');
    for (let i = 0; i < text.length; i++) {
        const c = text[i];
        if (c === '"') {
            if (quoted && text[i + 1] === '"') {
                field += '"';
                i++;
            }
            else
                quoted = !quoted;
        }
        else if (c === ',' && !quoted) {
            row.push(field);
            field = '';
        }
        else if ((c === '\n' || c === '\r') && !quoted) {
            if (c === '\r' && text[i + 1] === '\n')
                i++;
            row.push(field);
            rows.push(row);
            row = [];
            field = '';
        }
        else
            field += c;
    }
    if (field || row.length) {
        row.push(field);
        rows.push(row);
    }
    rows.forEach((r, i) => { if (i === 0) {
        for (let j = 0; j < r.length; j++)
            r[j] = toEnglish(r[j]);
    }
    else {
        for (const j of [6, 8, 12])
            if (r[j])
                r[j] = toEnglish(r[j]);
        if (r[11])
            r[11] = r[11] === 'scanning' ? 'Scanning' : r[11] === 'finished' ? 'Completed' : r[11];
    } });
    return '\uFEFF' + rows.map(r => r.map(v => '"' + v.replaceAll('"', '""') + '"').join(',')).join('\r\n');
}

function goToPage(target){if(busy)return;const pages=Math.max(1,Math.ceil((data?.total||0)/pageSize)),next=Math.min(pages,Math.max(1,Number(target)||1));if(!Number.isInteger(next)||next===page)return;page=next;return load();}
function changePageSize(){if(busy)return;const next=Number($('page-size').value);if(![25,50,100].includes(next)||next===pageSize)return;pageSize=next;page=1;return load();}
function resetFilters(){
 // A form control named/id reset shadows HTMLFormElement.reset in browsers.
 for(const id of ['location','query','from','to'])$(id).value='';
 $('status').value='all';page=1;return load();
}
function queryParams(){const params=new URLSearchParams({page:String(page),limit:String(pageSize),location:$('location').value.trim(),q:$('query').value.trim(),status:$('status').value});if($('from').value)params.set('from',new Date($('from').value+'T00:00:00').toISOString());if($('to').value){const end=new Date($('to').value+'T00:00:00');end.setDate(end.getDate()+1);params.set('to',end.toISOString());}return params;}
async function load(){const generation=++requestGeneration;busy=true;$('error').hidden=true;render();const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),30000);try{const response=await fetch('/api/reports?'+queryParams(),{cache:'no-store',signal:controller.signal});if(!response.ok)throw Error('HTTP '+response.status);const next=await response.json();if(!Array.isArray(next.items)||!next.stats)throw Error('Invalid response');if(generation!==requestGeneration)return;data=next;page=Number.isInteger(next.page)&&next.page>0?next.page:page;pageSize=[25,50,100].includes(next.limit)?next.limit:pageSize;lastSync=new Date().toISOString();}catch(e){if(generation!==requestGeneration)return;if(data){page=data.page||1;pageSize=data.limit||25;}$('error').textContent=t('报告读取失败，请刷新重试。如果登录已过期，请重新打开管理端。','Could not load reports. Refresh to retry, or reopen the console if your sign-in has expired.');$('error').hidden=false;}finally{clearTimeout(timer);if(generation===requestGeneration){busy=false;render();}}}
const reportCache=createReportCache({read:async id=>{const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),30000);try{const response=await fetch('/api/reports/'+id,{cache:'no-store',signal:controller.signal});if(!response.ok)throw Error('HTTP '+response.status);const value=await response.json();if(value.id!==id||!value.payload||!Array.isArray(value.payload.rows))throw Error('Invalid report');return value;}finally{clearTimeout(timer);}}});
function showDetailLoading(){detail=null;$('detail-heading').textContent=t('正在读取报告…','Loading report…');$('detail-meta').textContent='';$('detail-rows').textContent='';const row=el('tr'),cell=appendCell(row,el('span',t('正在读取明细，请稍候…','Loading report details, please wait…')));cell.colSpan=6;$('detail-rows').append(row);$('differences-only').disabled=true;$('detail-export').disabled=true;$('detail-modal').hidden=false;document.body.style.overflow='hidden';$('close-detail').focus();}
async function openDetail(id){const generation=++detailGeneration;$('error').hidden=true;showDetailLoading();try{const next=await reportCache.get(id);if(generation!==detailGeneration)return;detail=next;$('differences-only').checked=false;renderDetail();}catch{if(generation!==detailGeneration)return;closeDetail();$('error').textContent=t('报告明细读取失败，请重试。','Could not load this report. Please retry.');$('error').hidden=false;}}

function renderDetail(){$('differences-only').disabled=false;$('detail-export').disabled=false;const {payload:p,id,receivedAt}=detail;$('detail-heading').textContent=p.location+' · '+t('第 '+p.round+' 轮','Round '+p.round);const meta=$('detail-meta');meta.textContent='';for(const [zh,en,v]of [['操作者 / 扫描器','Operator / scanner',p.operator+' / '+p.deviceName],['核对完成','Completed',fmt(p.checkedAt)],['云端接收','Received',fmt(receivedAt)],['初始 Google 基准 / 读取时间','Original Google baseline / fetched at',p.snapshot.quantityBasis+' / '+fmt(p.snapshot.fetchedAt)],['报告编号','Report ID',id],['设备编号','Device ID',p.deviceId]]){const box=el('div');box.append(el('span',t(zh,en),'meta-label'),el('span',v,'meta-value'));meta.append(box);}const list=$('detail-rows');list.textContent='';const rows=p.rows.filter(r=>!$('differences-only').checked||r.status!=='一致');for(const r of rows){const tr=el('tr');if(r.status!=='一致')tr.className='difference';appendCell(tr,el('strong',r.sku),el('small',r.label,'sku-label'));if(r.baseline){const b=r.baseline;tr.firstElementChild.append(el('small',t('已采用 Cin7 基准','Cin7 baseline adopted'),'baseline-source'));tr.firstElementChild.append(el('small',t('原 Google：','Original Google: ')+b.googleQuantity+' → Cin7: '+b.quantity));tr.firstElementChild.append(el('small',b.warehouse+' / '+b.bin));tr.firstElementChild.append(el('small',t('Cin7 读取：','Cin7 fetched: ')+fmt(b.fetchedAt)));tr.firstElementChild.append(el('small',t('采用时间：','Adopted: ')+fmt(b.adoptedAt)));}for(const value of [r.expected,r.actual===''?'—':r.actual,r.diff,lang==='en'?toEnglish(r.status):r.status])appendCell(tr,el('span',value));const note=appendCell(tr,el('span',lang==='en'?toEnglish(r.note):r.note));if(r.referenceFetchedAt)note.append(el('small',t('参考读取：','Reference fetched: ')+fmt(r.referenceFetchedAt)));list.append(tr);}if(!rows.length){const tr=el('tr'),td=appendCell(tr,el('span',t('没有差异','No differences')));td.colSpan=6;list.append(tr);}}
function closeDetail(){++detailGeneration;$('detail-modal').hidden=true;document.body.style.overflow='';detail=null;}
$('language').onclick=()=>{lang=lang==='zh'?'en':'zh';try{localStorage.setItem('ubswh.google-test.bincheck.language',lang);}catch{}render();};$('refresh').onclick=load;$('filters').onsubmit=e=>{e.preventDefault();page=1;load();};$('reset').onclick=resetFilters;$('first').onclick=()=>goToPage(1);$('prev').onclick=()=>goToPage(page-1);$('next').onclick=()=>goToPage(page+1);$('last').onclick=()=>goToPage(Math.ceil((data?.total||0)/pageSize));$('page-select').onchange=()=>goToPage($('page-select').value);$('page-size').onchange=changePageSize;$('close-detail').onclick=closeDetail;$('differences-only').onchange=renderDetail;$('detail-export').onclick=()=>{if(detail)csvLink(detail.id,detail.payload.location);};document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDetail();if(e.key==='Tab'&&!$('detail-modal').hidden){const controls=[...$('detail-modal').querySelectorAll('button,input')],first=controls[0],last=controls.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});setInterval(()=>{if(!busy&&document.visibilityState==='visible'&&StockGoogle.hasAdminSession())load();},60000);render();if(StockGoogle.hasAdminSession())load();window.addEventListener('stockcheck-admin-login',()=>load());
</script><aside style="position:fixed;bottom:0;right:0;background:#fff4ce;color:#573d00;padding:4px 9px;z-index:30;font-size:12px">GOOGLE TEST · 独立测试版</aside></body></html>
