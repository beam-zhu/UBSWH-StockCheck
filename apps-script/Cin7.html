ng:30px}.detail{width:1250px;max-width:100%;max-height:92vh;overflow:auto}.detail-top{display:flex;justify-content:space-between;align-items:center;padding:25px 26px;border-bottom:1px solid #e5ecdf}.detail-top h2{font-size:25px;margin-top:4px}.detail-meta{padding:20px 26px;display:grid;grid-template-columns:repeat(3,1fr);gap:16px;color:#47613e}.meta-label{display:block;font-size:11px;color:#839176}.meta-value{overflow-wrap:anywhere;white-space:pre-line}.detail-actions{padding:0 26px 20px;display:flex;justify-content:space-between;align-items:center}.detail-actions label{display:flex;align-items:center;gap:8px}.detail-actions label span{margin:0}.detail td{max-width:420px}.detail td:nth-child(6){font-size:12px;min-width:240px;white-space:pre-wrap}.detail td:first-child{min-width:190px}td .sku-label{font-weight:400}.backdrop[hidden],[hidden]{display:none!important}@media(max-width:800px){header{height:auto;padding:18px 5%;align-items:start;flex-wrap:wrap}.head-actions{gap:10px;flex-wrap:wrap}main{padding:26px 5%}h1{font-size:27px}.stats{grid-template-columns:repeat(2,1fr);gap:10px}.stat{padding:15px 20px}.heading{align-items:start}.heading button{white-space:nowrap}.heading p{font-size:12px}.backdrop{padding:10px}.detail-meta{grid-template-columns:repeat(2,1fr)}form{padding:18px}.private{display:none}}

</style></head><body><header><a class="brand" href="__MANAGER_URL__">▥ <span>URBANSALES<small>WAREHOUSE MANAGEMENT</small></span></a><div class="head-actions"><span class="private" data-zh="仅所有者可配置" data-en="Owner settings"></span><button id="language">English</button><a href="__MANAGER_URL__" data-zh="返回报告管理 →" data-en="Back to reports →"></a></div></header><main style="max-width:850px"><div class="heading"><div><div class="eyebrow">CIN7 CORE</div><h1 data-zh="Cin7 连接设置" data-en="Cin7 connection settings"></h1><p data-zh="在这里填写 API Key，无需发送到聊天中。" data-en="Enter your API key here instead of sending it in chat."></p></div></div><section class="card settings-card"><p id="connection-state" role="status"></p><form id="cin7-form" autocomplete="off"><label for="account-id"><span>Account ID · api-auth-accountid</span><input id="account-id" name="accountId" type="text" autocomplete="off" maxlength="36" required spellcheck="false"></label><label for="application-key"><span>Application Key · api-auth-applicationkey</span><input id="application-key" name="applicationKey" type="password" autocomplete="new-password" maxlength="2048" required spellcheck="false" autocapitalize="off"></label><p class="settings-note" data-zh="Key 仅保存在 Google 项目的服务端配置中，保存后不回显，也不下发到扫描器。已有 Key 无法在页面中查看；需要更换时重新填写并保存。" data-en="Your key is stored in Google project server-side configuration and is not returned to this page or sent to scanners. Enter and save a new key to replace it."></p><button id="save-settings" class="primary" type="submit" disabled data-zh="保存连接信息" data-en="Save connection settings"></button><p id="save-message" role="status" hidden></p></form><div class="settings-explanation"><strong data-zh="保存后会发生什么？" data-en="What happens after saving?"></strong><p data-zh="保存不会自动调用 Cin7。配置后可在扫描页面点击差异 SKU 的「Cin7 实时校对」，仅查询该 SKU 的库存；Google 报表仍作为盘点基准。" data-en="Saving does not call Cin7. On the scanner, click Cin7 live check on a differing SKU to query its stock. Google reports remain the check baseline."></p></div></section></main><script>window.STOCKCHECK_CONFIG={apiUrl:"",environment:"google-test"};</script><script>// Browser -> Apps Script. POST text/plain avoids JSON preflight; no no-cors and no JSONP.
(function(){
 const nativeFetch=window.fetch.bind(window);let scannerToken='',scannerConfigPromise=null;
 const sessionKey='ubswh.google.admin.session';
 function adminToken(){try{return sessionStorage.getItem(sessionKey)||'';}catch{return '';}}
 function endpoint(){const url=window.STOCKCHECK_CONFIG?.apiUrl||'';if(!/^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(url))throw Error('尚未配置新 Google 测试后台 / New Google test backend is not configured');return url;}
 async function call(action,args={},signal){if(window.google?.script?.run){if(signal?.aborted)throw new DOMException('Aborted','AbortError');return new Promise((resolve,reject)=>{const abort=()=>reject(new DOMException('Aborted','AbortError'));signal?.addEventListener('abort',abort,{once:true});window.google.script.run.withSuccessHandler(value=>{signal?.removeEventListener('abort',abort);resolve(value);}).withFailureHandler(()=>{signal?.removeEventListener('abort',abort);reject(Error('Google 服务调用失败 / Google service call failed'));}).stockCheckRpc({action,...args});});}const res=await nativeFetch(endpoint(),{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,...args}),credentials:'omit',redirect:'follow',signal,cache:'no-store'});if(!res.ok)throw Error('Google backend HTTP '+res.status);let value;try{value=await res.json();}catch{throw Error('Google 后台没有返回 JSON；请检查部署权限 / Backend did not return JSON; check deployment access');}if(!value||typeof value.status!=='number'||!('data'in value))throw Error('Invalid Google backend response');return value;}
 async function scannerConfig(signal){if(!scannerConfigPromise)scannerConfigPromise=call('scanner_config',{},signal).then(r=>{if(!r.ok)throw Error(r.data.error);scannerToken=r.data.scannerToken;return r.data;}).catch(e=>{scannerConfigPromise=null;throw e;});return scannerConfigPromise;}
 window.StockGoogle={call,sessionKey,async login(password){const r=await call('admin_login',{password});if(!r.ok)throw Error('管理口令不正确、请求过多或后台未初始化 / Invalid password, rate limit, or backend not initialized');sessionStorage.setItem(sessionKey,r.data.token);},logout(){sessionStorage.removeItem(sessionKey);location.reload();}};
 window.fetch=async function(input,options={}){const path=typeof input==='string'?input:'';if(!path.startsWith('/api/'))return nativeFetch(input,options);const url=new URL(path,location.href),body=options.body?JSON.parse(options.body):{},signal=options.signal;let result;
 if(url.pathname==='/api/inventory')result=await call('inventory',{refresh:url.searchParams.get('refresh')==='1'},signal);
 else if(['/api/upload-config','/api/cin7/config'].includes(url.pathname)){const data=await scannerConfig(signal);return new Response(JSON.stringify(data),{status:200});}
 else if(url.pathname==='/api/upload-report'){await scannerConfig(signal);result=await call('upload_report',{...body,scannerToken},signal);if(result.data?.error==='SESSION'){scannerConfigPromise=null;await scannerConfig(signal);result=await call('upload_report',{...body,scannerToken},signal);}}
 else if(url.pathname==='/api/cin7/lookup'){await scannerConfig(signal);result=await call('cin7_lookup',{...body,scannerToken},signal);if(result.data?.error==='SESSION'){scannerConfigPromise=null;await scannerConfig(signal);result=await call('cin7_lookup',{...body,scannerToken},signal);}}
 else if(url.pathname==='/api/reports')result=await call('list_reports',{token:adminToken(),query:Object.fromEntries(url.searchParams)},signal);
 else if(url.pathname==='/api/cin7/settings')result=await call('cin7_settings',{token:adminToken(),...body,save:options.method==='POST'},signal);
 else {const m=url.pathname.match(/^\/api\/reports\/(r_[a-f0-9]{64})(\/csv)?$/);if(!m)throw Error('Unsupported endpoint');result=await call(m[2]?'report_csv':'report_detail',{token:adminToken(),id:m[1],lang:url.searchParams.get('lang')||'zh'},signal);if(m[2]&&result.ok)return new Response(result.data.csv,{status:200,headers:{'Content-Type':'text/csv;charset=utf-8'}});}
 if(result.status===401){sessionStorage.removeItem(sessionKey);document.getElementById('google-login')?.removeAttribute('hidden');}
 return new Response(JSON.stringify(result.data),{status:result.status,headers:{'Content-Type':'application/json'}});
 };
})();
</script><section id="google-login" style="position:fixed;inset:0;z-index:100;background:#f3f5f1;display:grid;place-items:center"><form id="google-login-form" style="background:white;border:1px solid #dce3d8;border-radius:12px;padding:30px;max-width:420px;display:block"><h2>Google 测试管理端 / Test console</h2><p>输入新项目的管理口令 / Enter the new project’s admin password</p><input id="google-password" aria-label="管理口令 / Admin password" type="password" autocomplete="current-password" required style="margin:16px 0"><button type="submit">登录 / Sign in</button><p id="google-login-error" role="alert"></p></form></section>
<script>document.getElementById('google-login-form').onsubmit=async e=>{e.preventDefault();const p=document.getElementById('google-password'),button=e.currentTarget.querySelector('button');button.disabled=true;try{await StockGoogle.login(p.value);p.value='';location.reload();}catch(err){document.getElementById('google-login-error').textContent=err.message;}finally{button.disabled=false;}};if(sessionStorage.getItem(StockGoogle.sessionKey))document.getElementById('google-login').hidden=true;</script>
<script type="module">const $=id=>document.getElementById(id);let lang='zh',ready=false,busy=false,configured=false,status='loading',message='';try{lang=localStorage.getItem('ubswh.google-test.bincheck.language')==='en'?'en':'zh';}catch{}
const t=(zh,en)=>lang==='en'?en:zh;
function render(){document.documentElement.lang=lang==='en'?'en':'zh-CN';document.title=t('Cin7 连接设置 · Urbansales','Cin7 connection settings · Urbansales');for(const node of document.querySelectorAll('[data-zh]'))node.textContent=node.dataset[lang];$('language').textContent=lang==='en'?'中文':'English';$('save-settings').disabled=!ready||busy;$('account-id').disabled=busy;$('application-key').disabled=busy;$('connection-state').textContent=status==='loading'?t('正在读取配置状态…','Loading settings…'):status==='error'?t('无法读取配置。请确认使用所有者账号登录后刷新。','Could not load settings. Sign in with the owner account and refresh.'):configured?t('连接信息已保存 · 可在扫描端点击差异 SKU 查询','Credentials saved · Look up differing SKUs on the scanner'):t('尚未配置 · 请填写并保存','Not configured · Enter and save your credentials');$('save-message').hidden=!message;$('save-message').textContent=message==='saved'?t('已保存到 Google 服务端配置。Key 已从输入框清除，尚未调用 Cin7。','Saved in Google server-side configuration. The key was cleared from the field. No Cin7 request has been made.'):message==='saving'?t('正在保存…','Saving…'):message==='error'?t('保存失败，请检查登录状态、Account ID 和 Key 后重试。','Save failed. Check your sign-in, account ID and key, then retry.'):'';}
async function load(){const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),20000);try{const response=await fetch('/api/cin7/settings',{cache:'no-store',signal:controller.signal});if(!response.ok)throw Error('Settings unavailable');const settings=await response.json();configured=settings.configured===true;$('account-id').value=settings.accountId||'';ready=true;status='ready';}catch{status='error';ready=false;}finally{clearTimeout(timer);render();}}
$('language').onclick=()=>{lang=lang==='zh'?'en':'zh';try{localStorage.setItem('ubswh.google-test.bincheck.language',lang);}catch{}render();};
$('cin7-form').onsubmit=async e=>{e.preventDefault();if(!ready||busy)return;busy=true;message='saving';render();const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),20000);try{const response=await fetch('/api/cin7/settings',{method:'POST',headers:{'Content-Type':'application/json','X-Cin7-Settings':'1'},body:JSON.stringify({accountId:$('account-id').value.trim(),applicationKey:$('application-key').value}),signal:controller.signal});if(!response.ok)throw Error('Save failed');const result=await response.json();if(!result.ok)throw Error('Save failed');configured=true;message='saved';}catch{message='error';}finally{clearTimeout(timer);$('application-key').value='';busy=false;render();}};render();load();
</script><aside style="position:fixed;bottom:0;right:0;background:#fff4ce;color:#573d00;padding:4px 9px;z-index:30;font-size:12px">GOOGLE TEST · 独立测试版</aside></body></html>
